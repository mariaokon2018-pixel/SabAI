<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SabAI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: var(--bg-dark);">
    
    <div style="width: 100%; max-width: 400px; padding: 24px; text-align: center;">
        <a href="index.html" class="logo" style="text-decoration: none; color: white; justify-content: center; margin-bottom: 32px;">
            <i class="fa-solid fa-bolt logo-icon"></i> SabAI
        </a>
        
        <h1 class="hero-heading" style="font-size: 32px; margin-bottom: 8px;">Welcome Back</h1>
        <p class="hero-subtitle" style="margin-bottom: 32px; font-size: 15px;">Login to your SabAI dashboard.</p>
        
        <div class="card" style="text-align: left; padding: 32px; box-shadow: 0 0 30px rgba(168, 85, 247, 0.1);">
            <form id="login-form">
                <div class="form-group" style="margin-bottom: 20px;">
                    <input type="email" id="email" class="form-control" placeholder="Admin Email" required>
                </div>
                <div class="form-group" style="margin-bottom: 24px;">
                    <input type="password" id="password" class="form-control" placeholder="Password" required>
                </div>
                
                <div id="login-error" style="color: #ef4444; font-size: 13px; margin-bottom: 16px; display: none; text-align: center;">
                    Incorrect email or password
                </div>
                
                <button type="submit" class="btn btn-primary btn-large" style="width: 100%;">Login</button>
                
                <div style="text-align: center; margin-top: 20px;">
                    <a href="#" id="forgot-password" style="color: var(--text-dim); text-decoration: none; font-size: 13px; transition: color 0.3s;" onmouseover="this.style.color='white'" onmouseout="this.style.color='var(--text-dim)'">Forgot password?</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Check if already logged in
        if(localStorage.getItem('sabai_auth') === 'true') {
            window.location.href = 'dashboard.html';
        }

        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('login-error');
        const forgotLink = document.getElementById('forgot-password');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            
            if (email && password) {
                localStorage.setItem('sabai_auth', 'true');
                window.location.href = 'dashboard.html';
            } else {
                errorMsg.style.display = 'block';
            }
        });

        forgotLink.addEventListener('click', (e) => {
            e.preventDefault();
            alert('Coming soon');
        });
    </script>
</body>
</html>
